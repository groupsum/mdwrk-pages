order = 20
path = "packages/00-contracts/structured-data"
ecosystem = "npm"
name = "@mdwrk/structured-data"

[[packages]]
id = "lander-core"
layer = "core"
order = 0
path = "packages/10-core/lander-core"
ecosystem = "npm"
name = "@mdwrk/lander-core"
dependencies = ["lander-content-contract"]

[[packages]]
id = "lander-markdown-content-adapter"
layer = "core"
order = 10
path = "packages/10-core/lander-markdown-content-adapter"
ecosystem = "npm"
name = "@mdwrk/lander-markdown-content-adapter"
dependencies = ["lander-content-contract", "lander-core"]

