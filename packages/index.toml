schema_version = "1.0.0"

[[layers]]
id = "contracts"
order = 0
description = "Portable contracts and structured-data builders."

[[layers]]
id = "core"
order = 10
description = "Framework-neutral compilation and markdown adaptation."

[[layers]]
id = "page-systems"
order = 20
description = "Reusable page templates and presets."

[[layers]]
id = "ui-foundation"
order = 30
description = "Tokens, themes, and UI primitives."

[[layers]]
id = "react-renderers"
order = 40
description = "React rendering and commerce UI."

[[layers]]
id = "machine-output"
order = 50
description = "Structured data, SEO, and discovery outputs."

[[layers]]
id = "content-packs"
order = 60
description = "Reusable demo and content bundles."

[[layers]]
id = "demos"
order = 70
description = "Runnable integration demos."

[[layers]]
id = "workspace-root"
order = 80
description = "Private npm workspace root."

[[packages]]
id = "lander-commerce-contract"
layer = "contracts"
order = 0
path = "packages/00-contracts/lander-commerce-contract"
ecosystem = "npm"
name = "@mdwrk/lander-commerce-contract"

[[packages]]
id = "lander-content-contract"
layer = "contracts"
order = 10
path = "packages/00-contracts/lander-content-contract"
ecosystem = "npm"
name = "@mdwrk/lander-content-contract"

[[packages]]
